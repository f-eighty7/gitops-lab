apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webb-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/f-eighty7/gitops-lab.git
    targetRevision: main
    path: infrastructure/webb-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
