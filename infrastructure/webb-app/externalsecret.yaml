apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: webb-app-secret
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-store
    kind: SecretStore
  target:
    name: webb-app-secret
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: webb-app
        property: api_key
    - secretKey: ENVIRONMENT
      remoteRef:
        key: webb-app
        property: environment
